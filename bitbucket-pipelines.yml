image: python:3.11

pipelines:
  default:
    - step:
        name: Deploy to Elastic Beanstalk
        script:
          - apt-get update && apt-get install -y unzip curl

          # Install required Python packages
          - pip install --upgrade pip
          - pip install packaging awsebcli

          # Install Node.js and npm
          - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          - apt-get install -y nodejs

          # Install Node.js app dependencies
          - npm install

          # Initialize Elastic Beanstalk CLI (non-interactive)
          - eb init test --region us-west-2 --platform "Node.js 22"

          # 🔥 Set the default environment (this is the fix!)
          - eb use testenvironment

          # 🚀 Deploy to Elastic Beanstalk
          - eb deploy
